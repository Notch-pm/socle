# Thème de connexion Edilumen (lot 4 — connexion unique).
#
# Hérite du thème « keycloak.v2 » de Keycloak 26 (PatternFly 5) : on ne réécrit
# AUCUN gabarit de formulaire — seulement l'habillage (couleurs, police,
# logo, mise en page) et les textes français. Les mises à jour de Keycloak
# continuent donc d'apporter leurs correctifs aux formulaires.
#
# Déploiement : `docker-compose.yml` monte ce dossier dans le conteneur ;
# realm `edilumen` → Realm settings → Themes → Login theme = « edilumen ».
# Détail : infra/keycloak/README.md, § « Thème de connexion ».
parent=keycloak.v2
import=common/keycloak

# Les styles du parent d'abord, puis l'habillage Edilumen.
styles=css/styles.css css/edilumen.css

# Un seul habillage, clair : la charte de la gamme n'a pas de version sombre.
darkMode=false

locales=fr
