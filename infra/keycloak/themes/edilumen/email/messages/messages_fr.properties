executeActionsBody=Votre administrateur vous demande de compléter votre compte Edilumen : {3}.\n\n{0}\n\nCe lien est valable {4} et ne sert qu''une fois.\n\nEdilumen — un seul compte pour Socle, Iris et Clara
emailUpdateConfirmationBody=Pour utiliser l''adresse {1} avec votre compte Edilumen, confirmez-la :\n\n{0}\n\nCe lien est valable {3}. Si vous n''êtes pas à l''origine de cette demande, ignorez ce message.\n\nEdilumen
identityProviderLinkBody=Pour vous connecter avec votre compte {0}, confirmez qu''il doit être relié à votre compte Edilumen :\n\n{3}\n\nCe lien est valable {5}. Si vous n''êtes pas à l''origine de cette demande, ignorez ce message.\n\nEdilumen

