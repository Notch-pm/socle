name: CI

# Rejoue les vérifications à chaque push sur main et sur chaque pull request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 = npm 11, qui a généré package-lock.json (npm 10 le juge
          # désynchronisé) ; @supabase/supabase-js exige par ailleurs Node >= 22.
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification des types (tsc)
        run: npm run lint

      - name: Tests unitaires (vitest)
        run: npm test
